name: Live desk capture

# The authoring sandbox cannot reach OLBG or most governing-body hosts. This job performs the
# first-hand reads on a GitHub-hosted runner, builds the compact desk model from the bodies,
# and commits the manifest + model + digest back to the branch that asked for them.
#
# A failed read never fails this job: a 403 or a timeout is evidence and is published on the
# desk's review page.

on:
  workflow_dispatch:
  push:
    paths:
      - "data/live_desk/requests.json"
      - "scripts/livedesk_collect.py"
      - "scripts/livedesk_model.py"
      - ".github/workflows/livedesk-live.yml"

permissions:
  contents: write

concurrency:
  group: livedesk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture OLBG listings and official pages
        run: python scripts/livedesk_collect.py

      - name: Build the desk model from the captures
        id: model
        continue-on-error: true
        run: |
          set +e
          python scripts/livedesk_model.py > /tmp/model.log 2>&1
          code=$?
          cat /tmp/model.log
          {
            echo "exit_code=$code"
            echo "--- python ---"
            python --version
            echo "--- tail of model log ---"
            tail -n 80 /tmp/model.log
          } > data/live_desk/model-debug.txt
          exit 0

      - name: Upload the raw bodies for offline parsing
        uses: actions/upload-artifact@v4
        with:
          name: livedesk-captures
          path: data/live_desk/captures/
          retention-days: 30

      - name: Commit the manifest and model back to this branch
        if: always()
        run: |
          git config user.name "livedesk-capture"
          git config user.email "livedesk-capture@users.noreply.github.com"
          git add data/live_desk/captures/manifest.json data/live_desk/model.json data/live_desk/digest.json data/live_desk/model-debug.txt || true
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "livedesk: manifest and model $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
