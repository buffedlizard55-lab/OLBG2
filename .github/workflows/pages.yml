name: Validate Pages content

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild verified multi-sport origination layer
        run: |
          python scripts/verified_seed.py
          python scripts/verified_model.py
          python scripts/verified_build.py

      - name: Rebuild live slate layer
        run: |
          python scripts/live_model.py
          python scripts/live_build.py

      - name: Rebuild the desk site from committed data
        run: python scripts/build.py

      - name: Rebuild and structurally validate the survey layer
        run: |
          python scripts/survey_sync_inventory.py
          python scripts/survey_lines.py
          python scripts/survey_analyse.py
          python scripts/survey_build.py
          python scripts/survey_verify.py

      - name: Rebuild the consolidated 17-sport desk
        run: |
          python scripts/final_consolidate.py
          python scripts/final_predictions.py
          python scripts/final_flags.py
          python scripts/final_build.py

      - name: Rebuild the canon 17-sport first-hand desk
        run: |
          python scripts/canon_data.py
          python scripts/canon_predictions.py
          python scripts/canon_flags.py
          python scripts/canon_sources.py
          python scripts/canon_build.py
          python scripts/canon_verify.py

      - name: Regenerate the root dashboard & integration layer
        run: python scripts/build_site.py

      - name: Check links across all published layers
        run: python scripts/integration_audit.py

      - name: Run the full automated test suite
        run: python -m unittest discover -s tests -v

      - name: Fail if any generated page or data file is stale
        run: git diff --exit-code -- verified data/verified live data/live site survey data/survey final data/final canon data/canon integration.html index.html picks.html flagged.html methodology.html sources.html sports assets
