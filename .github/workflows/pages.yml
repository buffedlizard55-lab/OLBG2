name: Validate Pages content

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild verified multi-sport origination layer
        run: |
          python scripts/verified_seed.py
          python scripts/verified_model.py
          python scripts/verified_build.py

      - name: Rebuild live slate layer
        run: |
          python scripts/live_model.py
          python scripts/live_build.py

      - name: Rebuild the desk site from committed data
        run: python scripts/build.py

      - name: Rebuild and structurally validate the survey layer
        run: |
          python scripts/survey_sync_inventory.py
          python scripts/survey_lines.py
          python scripts/survey_analyse.py
          python scripts/survey_build.py
          python scripts/survey_verify.py

      - name: Rebuild the consolidated 17-sport desk
        run: |
          python scripts/final_consolidate.py
          python scripts/final_predictions.py
          python scripts/final_flags.py
          python scripts/final_build.py

      - name: Rebuild the canon 17-sport first-hand desk
        run: |
          python scripts/canon_data.py
          python scripts/canon_predictions.py
          python scripts/canon_flags.py
          python scripts/canon_sources.py
          python scripts/canon_build.py
          python scripts/canon_verify.py

      - name: Rebuild the first-hand Atlas desk
        run: |
          python scripts/atlas_seed.py
          python scripts/atlas_model.py
          python scripts/atlas_predictions.py
          python scripts/atlas_verify.py
          python scripts/atlas_build.py

      - name: Rebuild current capture desk (offline committed evidence)
        run: |
          python scripts/current_seed.py
          python scripts/current_model.py
          python scripts/current_build.py

      - name: Rebuild the daily top-five desk
        run: |
          python scripts/daily_seed.py
          python scripts/daily_model.py
          python scripts/daily_verify.py
          python scripts/daily_build.py

      - name: Rebuild the daily audit desk
        run: |
          python scripts/daily_audit_model.py
          python scripts/daily_audit_build.py

      - name: Rebuild the 15-sport focus desk
        run: |
          python scripts/focus_seed.py
          python scripts/focus_model.py
          python scripts/focus_predictions.py
          python scripts/focus_build.py
          python scripts/focus_verify.py

      - name: Rebuild the 15-sport live board
        run: |
          python scripts/liveboard_model.py
          python scripts/liveboard_build.py

      - name: Rebuild the 24 October /clarity/ fifteen-sport desk
        run: |
          python scripts/clarity_seed.py
          python scripts/clarity_model.py
          python scripts/clarity_predictions.py
          python scripts/clarity_audit.py
          python scripts/clarity_build.py
          python scripts/clarity_verify.py

      - name: Rebuild the current 15-sport cadence desk and final integration audit
        run: |
          python scripts/cadence_seed.py
          python scripts/cadence_model.py
          python scripts/cadence_predictions.py
          python scripts/cadence_build.py
          python scripts/cadence_verify.py
          python scripts/integration_f0ee1b4a_audit.py

      - name: Regenerate the root dashboard & integration layer
        run: python scripts/build_site.py

      - name: Rebuild the 15-sport daily brief desk
        run: |
          python scripts/brief_model.py
          python scripts/brief_predictions.py
          python scripts/brief_build.py
          python scripts/brief_verify.py

      - name: Rebuild the canonical 15-sport OLBG desk
        run: |
          python scripts/olbg_seed.py
          python scripts/olbg_model.py
          python scripts/olbg_predictions.py
          python scripts/olbg_build.py
          python scripts/olbg_verify.py

      - name: Rebuild the evidence-first 15-sport monitor
        run: |
          python scripts/monitor_seed.py
          python scripts/monitor_build.py

      - name: Rebuild the 15-sport ledger desk
        run: |
          python scripts/ledger_seed.py
          python scripts/ledger_official.py
          python scripts/ledger_merge.py
          python scripts/ledger_model.py
          python scripts/ledger_picks.py
          python scripts/ledger_inherit.py
          python scripts/ledger_predictions.py
          python scripts/ledger_report.py
          python scripts/ledger_build.py
          python scripts/ledger_verify.py

      - name: Rebuild and verify the consolidated 15-sport desk
        run: |
          python scripts/master_data.py
          python scripts/master_extra.py
          python scripts/master_top5.py
          python scripts/master_build.py
          python scripts/master_verify.py

      - name: Rebuild the 24 October board (/today/) and verify it line by line
        run: |
          python scripts/today_seed.py
          python scripts/today_model.py
          python scripts/today_predictions.py
          python scripts/today_flags.py
          python scripts/today_build.py
          python scripts/today_verify.py

      - name: Build the live desk from the committed model and predictions
        run: |
          python scripts/livedesk_build.py
          python scripts/livedesk_verify.py

      - name: Check links across all published layers
        run: python scripts/integration_audit.py

      - name: Run the full automated test suite
        run: python -m unittest discover -s tests -v

      - name: Report any drifted file as an annotation
        run: |
          git diff --name-only | sed 's/^/::error::stale generated file /' || true

      - name: Fail if any generated page or data file is stale
        run: git diff --exit-code -- current data/current verified data/verified live data/live site survey data/survey final data/final canon data/canon atlas data/atlas integration.html index.html picks.html flagged.html methodology.html sources.html sports assets daily data/daily daily-audit data/daily-audit focus data/focus monitor data/monitor liveboard data/liveboard brief data/brief olbg data/olbg cadence data/cadence data/integration-f0ee1b4a research/integration-f0ee1b4a.md ledger data/ledger/olbg.json data/ledger/official.json data/ledger/matches.json data/ledger/lines.json data/ledger/picks.json data/ledger/predictions.json data/ledger/flagged.json data/ledger/sources.json data/ledger/repo_review.json data/ledger/verify.json data/ledger/inherited.json master data/master today data/today clarity data/clarity live-desk
