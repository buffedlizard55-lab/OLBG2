name: Validate Pages content
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate snapshot and generated pages
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py
          git diff --exit-code -- site
