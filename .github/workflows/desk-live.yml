name: Desk live capture

# The authoring sandbox cannot reach OLBG or the governing-body APIs. This job performs the
# first-hand reads on a GitHub-hosted runner, commits the small manifest (URL, time, status,
# bytes, sha256 per response) and uploads the raw bodies as a workflow artifact so the desk
# can be parsed and verified offline.
#
# A failed read never fails the job: a 403 or a timeout is evidence and is published on the
# desk's review page.

on:
  workflow_dispatch:
  push:
    paths:
      - "data/desk/requests.json"
      - "scripts/desk_collect.py"
      - ".github/workflows/desk-live.yml"

permissions:
  contents: write

concurrency:
  group: desk-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture OLBG listings and official pages
        run: python scripts/desk_collect.py

      - name: Build the desk model from the captures
        run: python scripts/desk_model.py

      - name: Upload the raw bodies for offline parsing
        uses: actions/upload-artifact@v4
        with:
          name: desk-captures
          path: data/desk/captures/
          retention-days: 30

      - name: Commit the capture manifest back to this branch
        run: |
          git config user.name "desk-capture"
          git config user.email "desk-capture@users.noreply.github.com"
          git add data/desk/captures/manifest.json data/desk/model.json data/desk/digest.json
          if git diff --cached --quiet; then
            echo "no manifest change"
            exit 0
          fi
          git commit -m "desk: capture manifest and model $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
